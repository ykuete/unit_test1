name: Unit Test Workflow and code coverage

on:
  pull_request:

jobs:
  build:
    permissions:
        checks: write
        pull-requests: write
        contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test 
      - uses: ArtiomTr/jest-coverage-report-action@v2

      